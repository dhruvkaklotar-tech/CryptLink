name: CryptLink High-Assurance CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  frontend-audit:
    name: Frontend Cryptographic & Reactivity Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: TypeScript Static Typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: Run Cryptographic Primitives & Double Ratchet Tests (Vitest)
        working-directory: frontend
        run: pnpm run test

      - name: Production Vite Bundler Verification
        working-directory: frontend
        run: pnpm run build

  backend-audit:
    name: Backend Cryptographic & Security Audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Environment Config
        run: |
          cp .env.example .env

      - name: Build and Start CryptLink Microservices Stack
        run: |
          docker compose -f dev.compose.yml up -d --build
          sleep 10
          docker compose -f dev.compose.yml ps

      - name: Run Ruff Code Quality & Static Security Analysis
        run: |
          docker compose -f dev.compose.yml exec -T backend ruff check /app/app /app/tests

      - name: Run Ruff Formatting Verification
        run: |
          docker compose -f dev.compose.yml exec -T backend ruff format --check /app/app /app/tests

      - name: Run Pytest Cryptographic Protocol & Attack Test Suite
        run: |
          docker compose -f dev.compose.yml exec -T backend pytest /app/tests -v

      - name: Clean Teardown
        if: always()
        run: |
          docker compose -f dev.compose.yml down -v
